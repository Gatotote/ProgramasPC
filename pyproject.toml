[project]
name = "bovedafacial"
version = "0.1.0"
description = "Bóveda de carpetas cifrada con desbloqueo por reconocimiento facial (InsightFace/ArcFace) + PIN"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=43",
    "argon2-cffi>=23",
    "mnemonic>=0.21",
    "click>=8.1",
    "platformdirs>=4",
]

[project.optional-dependencies]
# Fase 2: motor facial. Se instala con  uv sync --extra face
# onnxruntime-gpu[cuda,cudnn] trae los wheels nvidia-*-cu13 (CUDA 13 + cuDNN 9),
# así que la GPU funciona sin instalar el toolkit CUDA en el sistema.
face = [
    "insightface>=0.7.3",
    "onnxruntime-gpu[cuda,cudnn]>=1.29",
    "opencv-python>=4.10",
    "numpy>=1.26",
]
# Fase 4: interfaz. Se instala con  uv sync --extra gui
gui = [
    "PySide6>=6.7",
]

[project.scripts]
bovedafacial = "bovedafacial.cli:main"
bovedafacial-gui = "bovedafacial.ui.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bovedafacial"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# insightface arrastra `onnxruntime` (CPU) y choca con `onnxruntime-gpu` (mismo
# directorio de instalación). Anulamos la CPU: onnxruntime-gpu ya cubre el
# import `onnxruntime`.
override-dependencies = ["onnxruntime; sys_platform == 'nunca'"]
